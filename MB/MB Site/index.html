<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maelle Beauty - Révélez ta lumière naturelle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Palette Peony Blush */
        body { background-color: #FFE4E1; color: #AD1457; font-family: 'Segoe UI', sans-serif; }
        .bg-primary { background-color: #AD1457; }
        .text-primary { color: #AD1457; }
        .bg-secondary { background-color: #f7a8c4; }
        .bg-gradient-peony { background: linear-gradient(135deg, #FFE4E1 0%, #AD1457 100%); }
        .btn-hover:hover { background-color: #8a1045; }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="p-6 flex justify-between items-center bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50">
        <h1 class="text-2xl font-bold text-primary tracking-wider uppercase">Maelle Beauty</h1>
        <button onclick="toggleCart()" class="bg-[#AD1457] text-white px-5 py-2 rounded-full font-medium shadow-lg transition transform hover:scale-105">
            Panier (<span id="cart-count">0</span>)
        </button>
    </header>

    <!-- Hero Section -->
    <section class="text-center py-24 px-4 bg-gradient-peony text-white">
        <h2 class="text-5xl md:text-7xl font-bold mb-6">Révèle ta lumière naturelle</h2>
        <p class="mb-10 text-xl font-light">L'éclat que vous méritez, sublimé par la nature.</p>
        <a href="#produits" class="bg-white text-[#AD1457] px-10 py-4 rounded-full text-lg font-bold shadow-xl hover:bg-gray-100 transition">Découvrir la collection</a>
    </section>

    <!-- Produits -->
    <section id="produits" class="max-w-6xl mx-auto p-8">
        <h2 class="text-3xl font-bold text-center mb-12 uppercase tracking-widest">Nos Produits</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Produit 1 -->
            <div class="bg-white p-8 rounded-3xl shadow-xl text-center border-t-4 border-[#AD1457]">
                <div class="h-48 bg-[#f9c2d1] mb-6 rounded-2xl flex items-center justify-center font-bold text-[#AD1457]">Éclat Intense</div>
                <h3 class="font-bold text-xl mb-2">Serum Éclat</h3>
                <p class="text-gray-700 mb-4 font-semibold">15 000 FCFA</p>
                <button onclick="addToCart('Serum Éclat', 15000)" class="w-full bg-[#AD1457] text-white py-3 rounded-xl btn-hover transition">Ajouter</button>
            </div>
            <!-- Produit 2 -->
            <div class="bg-white p-8 rounded-3xl shadow-xl text-center border-t-4 border-[#AD1457]">
                <div class="h-48 bg-[#f9c2d1] mb-6 rounded-2xl flex items-center justify-center font-bold text-[#AD1457]">Crème Soyeuse</div>
                <h3 class="font-bold text-xl mb-2">Crème Divine</h3>
                <p class="text-gray-700 mb-4 font-semibold">12 500 FCFA</p>
                <button onclick="addToCart('Crème Divine', 12500)" class="w-full bg-[#AD1457] text-white py-3 rounded-xl btn-hover transition">Ajouter</button>
            </div>
            <!-- Produit 3 -->
            <div class="bg-white p-8 rounded-3xl shadow-xl text-center border-t-4 border-[#AD1457]">
                <div class="h-48 bg-[#f9c2d1] mb-6 rounded-2xl flex items-center justify-center font-bold text-[#AD1457]">Énergie Pure</div>
                <h3 class="font-bold text-xl mb-2">Huile Lumière</h3>
                <p class="text-gray-700 mb-4 font-semibold">18 000 FCFA</p>
                <button onclick="addToCart('Huile Lumière', 18000)" class="w-full bg-[#AD1457] text-white py-3 rounded-xl btn-hover transition">Ajouter</button>
            </div>
        </div>
    </section>

    <!-- Panier Modal -->
    <div id="cart-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white p-8 rounded-3xl w-full max-w-md shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-[#AD1457]">Mon Panier</h2>
            <div id="cart-items" class="mb-6 space-y-2 border-b pb-4"></div>
            <p class="font-bold mb-6 text-xl text-gray-800">Total: <span id="total-price">0</span> FCFA</p>
            <button onclick="checkout()" class="w-full bg-green-600 text-white py-4 rounded-xl font-bold hover:bg-green-700 transition mb-2">Commander via WhatsApp</button>
            <button onclick="toggleCart()" class="w-full text-gray-400 py-2">Fermer</button>
        </div>
    </div>

    <script>
        let cart = [];
        let total = 0;

        function addToCart(name, price) {
            cart.push({name, price});
            total += price;
            updateUI();
        }

        function updateUI() {
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('total-price').innerText = total.toLocaleString();
            const itemsList = document.getElementById('cart-items');
            itemsList.innerHTML = cart.map(item => `<div class="flex justify-between"><span>${item.name}</span><span>${item.price} FCFA</span></div>`).join('');
        }

        function toggleCart() {
            document.getElementById('cart-modal').classList.toggle('hidden');
        }

        function checkout() {
            if (cart.length === 0) return;
            const message = `Bonjour Maelle Beauty, je souhaite commander : ${cart.map(i => i.name).join(', ')}. Total : ${total.toLocaleString()} FCFA.`;
            const url = `https://wa.me/237652922425?text=${encodeURIComponent(message)}`;
            window.open(url, '_blank');
        }
    </script>
</body>
</html>
